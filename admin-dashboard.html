<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>フォトビンゴ 管理者ダッシュボード</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

</head>


<body>

<header>

<h1>
繋がる！七地区フォトビンゴ
</h1>

<p>
管理者ダッシュボード
</p>

</header>


<main>

<div class="admin-dashboard">


    <!-- ============================ -->
    <!-- ミッション設定 -->
    <!-- ============================ -->

    <div class="mission-settings">

        <h2>
            🎯 ミッション設定
        </h2>


        <p>
            25個のミッション内容を編集できます。
        </p>


        <p>
            ※マス数は25個で固定です。
        </p>


        <!-- ============================ -->
        <!-- ミッション編集欄 -->
        <!-- ============================ -->

        <div
            id="missionEditor"
            class="mission-editor"
        >

            <p>
                ミッションを読み込んでいます...
            </p>

        </div>


        <!-- ============================ -->
        <!-- 保存ボタン -->
        <!-- ============================ -->

        <button
            id="saveMissionsButton"
            class="save-missions-button"
        >
            💾 ミッションを保存
        </button>


        <!-- ============================ -->
        <!-- 保存メッセージ -->
        <!-- ============================ -->

        <p
            id="missionSaveMessage"
            class="mission-save-message"
        ></p>


    </div>



    <!-- ============================ -->
    <!-- チーム進捗 -->
    <!-- ============================ -->

    <div class="team-progress-section">

        <h2>
            📊 チーム進捗
        </h2>


        <div
            id="teamList"
            class="team-list"
        >

            <p>
                チーム情報を読み込んでいます...
            </p>

        </div>

    </div>


</div>



<!-- ============================ -->
<!-- 写真詳細モーダル -->
<!-- ============================ -->

<div
    id="photoModal"
    class="photo-modal"
>

    <div class="photo-modal-content">


        <!-- 閉じるボタン -->

        <button
            id="closePhotoModal"
            class="close-photo-modal"
        >
            ✕
        </button>


        <!-- タイトル -->

        <h2 id="photoModalTitle">
            写真詳細
        </h2>


        <!-- 写真一覧 -->

        <div
            id="photoList"
            class="photo-list"
        >
        </div>


    </div>

</div>



<!-- ============================ -->
<!-- 管理者用JavaScript -->
<!-- ============================ -->

<script
    type="module"
    src="js/admin-dashboard.js"
></script>


</body>

</html>
